<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Navtesh Nijhawan{% endblock %}</title>
    <meta name="description" content="{% block description %}Personal site of Navtesh Nijhawan — Computer Science student, developer, and builder of cool things.{% endblock %}">

    <link rel="icon" type="image/svg+xml" href="{{ url_for('static', filename='favicon.svg', v=asset_v) }}">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css', v=asset_v) }}">
    <script src="{{ url_for('static', filename='js/starfield.js', v=asset_v) }}" defer></script>
    {% block head_extra %}{% endblock %}
</head>
<body class="{% block body_class %}{% endblock %}">
    <div class="loading-overlay"></div>
    <div id="starfield" aria-hidden="true">
        <canvas id="starfield-canvas"></canvas>
    </div>

    {% block content %}{% endblock %}

    {% block footer %}
    <footer class="site-footer">
        <span>© <span id="year"></span> Navtesh Nijhawan</span>
    </footer>
    {% endblock %}

    <script>
        // Reveal fade-ins
        document.addEventListener('DOMContentLoaded', () => {
            const els = document.querySelectorAll('.fade-in');
            const io = new IntersectionObserver((entries) => {
                entries.forEach(entry => {
                    if (entry.isIntersecting) {
                        entry.target.classList.add('visible');
                        io.unobserve(entry.target);
                    }
                });
            }, { threshold: 0.12 });

            els.forEach((el, i) => {
                el.style.transitionDelay = `${Math.min(i * 80, 600)}ms`;
                io.observe(el);
            });

            const yearEl = document.getElementById('year');
            if (yearEl) yearEl.textContent = new Date().getFullYear();
        });
    </script>

    {% block scripts %}{% endblock %}
</body>
</html>
